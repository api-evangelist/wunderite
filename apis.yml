aid: wunderite
name: Wunderite
description: >-
  Wunderite is an insurance application automation platform for agencies and brokers that
  finds, autofills, and digitally signs insurance forms — ACORDs and supplementals — up to
  12x faster than manual workflows. The platform pairs a powerful autofill engine with live
  customer collaboration, spreadsheet-like schedule editors, third-party data enrichment,
  and built-in e-signature (ESIGN/UETA). The Wunderite REST API (v1) exposes risk profiles
  and risk data — buildings, vehicles, drivers, contacts, premises, equipment, workers'
  comp, subjects of insurance and more — with bearer-token auth, cursor pagination, field
  inclusion, and HMAC-signed webhooks, plus direct integrations with Vertafore AMS360,
  ImageRight, and Zapier. Wunderite is SOC 2 Type II audited and a Techstars portfolio
  company.
