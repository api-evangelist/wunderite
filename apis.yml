apis:
- name: Wunderite API
  description: >-
    REST API (v1) for programmatic access to Wunderite risk data and related resources —
    risk profiles, buildings, vehicles, drivers, contacts, premises, equipment, homes,
    legal entities, liabilities, subjects of insurance, workers' comp, plus lookup data
    (NAICS, SIC, class codes). Bearer-token authentication with API keys, cursor-based
    pagination, filtering, sorting, relation includes, request flags, and HMAC-SHA256
    signed webhooks for form, signature-packet, and risk-data change events.
  humanURL: https://docs.wunderite.com
  baseURL: https://app.wunderite.com/api/v1
